# RecoStream on one host (e.g. an EC2 instance): Kafka, Redis, the serving
# API, the streaming feature updater, and Prometheus. Models are pulled from
# S3 (set S3_BUCKET / AWS_REGION; on EC2 credentials come from the instance
# role). For local runs without AWS, `docker compose --profile local-s3 up`
# adds an S3-compatible endpoint and sets S3_ENDPOINT.
x-app: &app
  build: .
  image: recostream:latest
  environment: &env
    KAFKA_BOOTSTRAP: kafka:9092
    REDIS_URL: redis://redis:6379/0
    S3_BUCKET: ${S3_BUCKET:-recostream-models}
    AWS_REGION: ${AWS_REGION:-us-east-1}
    S3_ENDPOINT: ${S3_ENDPOINT:-}
  restart: unless-stopped

services:
  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 8
    ports: ["9092:9092"]

  redis:
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "noeviction"]

  api:
    <<: *app
    ports: ["8000:8000"]
    depends_on: [redis]

  consumer:
    <<: *app
    command: ["python", "-m", "recostream.stream.consumer", "--workers", "4", "--batch", "1000"]
    depends_on: [kafka, redis]

  s3:
    image: motoserver/moto:5.0.14
    profiles: [local-s3]
    ports: ["9000:5000"]

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes: [./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["9090:9090"]
