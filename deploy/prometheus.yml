global:
  scrape_interval: 5s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8000"]
  - job_name: consumer
    static_configs:
      - targets: ["consumer:9300"]

# Useful queries
#   histogram_quantile(0.95, sum by (le) (rate(reco_request_seconds_bucket[1m])))        p95 serving latency
#   sum by (stage) (rate(reco_stage_seconds_sum[1m])) / sum by (stage) (rate(reco_stage_seconds_count[1m]))
#   histogram_quantile(0.5, sum by (le) (rate(reco_batch_size_bucket[1m])))               typical batch size
#   sum(rate(reco_stream_events_total[30s]))                                              events/sec
#   sum(rate(reco_online_hits_total[5m])) / sum(rate(reco_online_events_with_recs_total[5m]))   online hit rate
#   reco_model_info                                                                       active model + offline NDCG@10
