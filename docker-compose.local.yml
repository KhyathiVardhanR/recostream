# Local override: run the whole stack without AWS, against the S3-compatible
# endpoint from the `local-s3` profile.
#   docker compose -f docker-compose.yml -f docker-compose.local.yml --profile local-s3 up -d
x-local-env: &local-env
  S3_ENDPOINT: http://s3:5000
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test

services:
  api:
    environment: *local-env
  consumer:
    environment: *local-env
  # One-off jobs: load online features / replay events (MovieLens data mounted read-only)
  bootstrap:
    image: recostream:latest
    profiles: [jobs]
    command: ["python", "-m", "recostream.bootstrap"]
    environment:
      <<: *local-env
      REDIS_URL: redis://redis:6379/0
      RECO_DATA_DIR: /data
    volumes: [./data:/data:ro]
  producer:
    image: recostream:latest
    profiles: [jobs]
    command: ["python", "-m", "recostream.stream.producer", "--split", "test", "--rate", "5000", "--limit", "50000"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      RECO_DATA_DIR: /data
    volumes: [./data:/data:ro]
